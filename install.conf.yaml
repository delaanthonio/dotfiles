- defaults:
    link:
      create: true
      relink: true

- shell: [git submodule update --init --recursive]

- clean: ['~']

- link:
    ~/.claude/settings.json:
        path: claude/settings.json
        force: true
    ~/.claude/CLAUDE.md/: agents/AGENTS.md
    ~/.claude/agents/:
        path: claude/agents/**
        glob: true
    ~/.claude/commands/:
        path: claude/commands/**
        glob: true
    ~/.claude/scripts/:
        path: claude/scripts/**
        glob: true
    ~/.claude/skills/:
        path: claude/skills
        create: true
        force: true
    ~/.codex/config.toml: codex/config.toml
    ~/.config/direnv/direnvrc: direnvrc
    ~/.config/fish/conf.d:
        path: config/fish/conf.d
        force: true
    ~/.config/fish/completions/:
        path: config/fish/completions/**
        glob: true
    ~/.config/fish/functions/:
        path: config/fish/functions/**
        glob: true
    ~/.config/opencode/AGENTS.md: agents/AGENTS.md
    ~/.config/opencode/agents:
        path: config/opencode/agents
        create: true
        force: true
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.config/ghostty/config:
        path: config/ghostty/config
        force: true
    ~/Library/Application Support/com.mitchellh.ghostty/config:
        if: '[ `uname` = Darwin ]'
        path: config/ghostty/config
        force: true
    ~/Library/Application Support/com.cmuxterm.app/config.ghostty:
        if: '[ `uname` = Darwin ]'
        path: config/cmux/config.ghostty
        force: true
    ~/.config/cmux/cmux.json:
        path: config/cmux/cmux.json
        force: true
    ~/.config/ccstatusline/settings.json:
        path: config/ccstatusline/settings.json
        force: true
    ~/.config/tmux/tmux.conf:
      path: config/tmux/tmux.conf
      force: true
    ~/.config/tmux/options.conf:
      path: config/tmux/options.conf
      force: true
    ~/.config/tmux/bindings.conf:
      path: config/tmux/bindings.conf
      force: true
    ~/.config/tmux/theme.conf:
      path: config/tmux/theme.conf
      force: true
    ~/.config/tmux/status.conf:
      path: config/tmux/status.conf
      force: true
    ~/.config/tmux/host-status.sh:
      path: config/tmux/host-status.sh
      force: true
    ~/.config/tmux/cheatsheet.sh:
      path: config/tmux/cheatsheet.sh
      force: true
    ~/.config/tmux/clipboard.sh:
      path: config/tmux/clipboard.sh
      force: true
    ~/.config/tmux/sessionizer.sh:
      path: config/tmux/sessionizer.sh
      force: true
    ~/.config/tmux/health-check.sh:
      path: config/tmux/health-check.sh
      force: true
    ~/.config/zellij/config.kdl:
        path: config/zellij/config.kdl
        force: true
    ~/.config/zellij/layouts:
        path: config/zellij/layouts
        force: true
    ~/.config/nvim:
    ~/.config/starship.toml: starship.toml
    ~/.config/topgrade.toml:
    ~/.doom.d:
    ~/.emacs.d:
    ~/.ideavimrc:
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.zshenv:
    ~/.zshrc:

- shell: [bash config/npm/install.sh] # install ccstatusline and other managed npm packages after symlinks are in place
