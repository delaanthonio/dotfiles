- defaults:
    link:
      create: true
      relink: true

- shell: [git submodule update --init --recursive]

- shell:
  # Backup-and-link: pre-emptively move aside any existing regular file (or
  # whole directory) at a dotbot symlink-target path so the link step can
  # create a fresh symlink without needing force:true (which would clobber
  # user edits silently). Backups are created as <path>.bak.<unix-ts>; once
  # symlinked, subsequent runs are no-ops since dotbot is no longer in
  # conflict with regular files.
  # ~/.codex/config.toml is intentionally NOT in this list — the dotfile
  # is the empty template and the home copy carries rich local config.
  - command: |
      set -euo pipefail
      DOTFILES="${DOTBOT_DIR:-$(pwd)}"
      TS=$(date +%s)


      # 1) Whole-path backup: real files or directories at these symlink
      #    target paths are moved aside entirely (these paths are linked
      #    as a whole, not per-entry).
      for path in \
          "$HOME/.config/fish/conf.d" \
          "$HOME/.config/fish/functions" \
          "$HOME/.config/tmux" \
          "$HOME/.config/zellij/layouts"; do
        [ -e "$path" ] || continue
        [ -L "$path" ] && continue
        mv "$path" "$path.bak.$TS"
        echo "preserved $path -> $path.bak.$TS"
      done

      # 2) Per-file backup inside shared home dirs: only regular files whose
      #    dotfiles counterpart exists are backed up. Local-only files stay
      #    put.
      for pair in \
          "$HOME/.config/fish/completions:$DOTFILES/config/fish/completions"; do
        home="${pair%%:*}"; src="${pair#*:}"
        [ -d "$home" ] || continue
        for entry in "$home"/*; do
          [ -e "$entry" ] || continue
          [ -L "$entry" ] && continue
          [ -f "$entry" ] || continue
          name=$(basename "$entry")
          [ -e "$src/$name" ] || continue
          mv "$entry" "$entry.bak.$TS"
          echo "preserved $entry -> $entry.bak.$TS"
        done
      done

      # 3) Single-file backup: same rule for standalone config files.
      for pair in \
          "$HOME/.config/herdr/config.toml:$DOTFILES/config/herdr/config.toml" \
          "$HOME/.config/ghostty/config:$DOTFILES/config/ghostty/config" \
          "$HOME/Library/Application Support/com.mitchellh.ghostty/config:$DOTFILES/config/ghostty/config" \
          "$HOME/Library/Application Support/com.cmuxterm.app/config.ghostty:$DOTFILES/config/cmux/config.ghostty" \
          "$HOME/.config/cmux/cmux.json:$DOTFILES/config/cmux/cmux.json" \
          "$HOME/.config/ccstatusline/settings.json:$DOTFILES/config/ccstatusline/settings.json"; do
        home="${pair%%:*}"; src="${pair#*:}"
        [ -e "$home" ] || continue
        [ -L "$home" ] && continue
        [ -f "$home" ] || continue
        [ -e "$src" ] || continue
        mv "$home" "$home.bak.$TS"
        echo "preserved $home -> $home.bak.$TS"
      done
    stderr: true

- clean:
    - ~/.claude
    - ~/.config/opencode

- shell:
    # Enable the droid-daemon LaunchAgent if it is linked but not loaded.
    # Idempotent: bootstrap fails harmlessly when already loaded.
    command: |
      if [ "$(uname)" = Darwin ]; then
        PLIST="$HOME/Library/LaunchAgents/ai.factory.droid-daemon.plist"
        SERVICE="gui/$(id -u)/ai.factory.droid-daemon"
        if [ -f "$PLIST" ] && ! launchctl print "$SERVICE" >/dev/null 2>&1; then
          launchctl bootstrap "gui/$(id -u)" "$PLIST" 2>/dev/null ||
            echo "droid-daemon: bootstrap failed (enable manually with launchctl)"
        fi
      fi

- link:
    ~/.config/direnv/direnvrc: direnvrc
    ~/.config/fish/conf.d:
        path: config/fish/conf.d
    ~/.config/fish/completions/:
        path: config/fish/completions/**
        glob: true
    ~/.config/fish/functions:
        path: config/fish/functions
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.config/herdr/config.toml:
        path: config/herdr/config.toml
    ~/.config/ghostty/config:
        path: config/ghostty/config
    ~/Library/Application Support/com.mitchellh.ghostty/config:
        if: '[ `uname` = Darwin ]'
        path: config/ghostty/config
    ~/Library/Application Support/com.cmuxterm.app/config.ghostty:
        if: '[ `uname` = Darwin ]'
        path: config/cmux/config.ghostty
    ~/Library/LaunchAgents/ai.factory.droid-daemon.plist:
        if: '[ `uname` = Darwin ]'
        path: config/launchd/ai.factory.droid-daemon.plist
    ~/.config/cmux/cmux.json:
        path: config/cmux/cmux.json
    ~/.config/ccstatusline/settings.json:
        path: config/ccstatusline/settings.json
    ~/.config/tmux:
      path: config/tmux
    ~/.config/zellij/config.kdl:
        path: config/zellij/config.kdl
    ~/.config/zellij/layouts:
        path: config/zellij/layouts
    ~/.config/nvim:
    ~/.config/starship.toml: starship.toml
    ~/.config/topgrade.toml:
    ~/.doom.d:
    ~/.emacs.d:
    ~/Applications/Emacs Client.app:
        path: config/emacs-client/Emacs Client.app
        force: true
    ~/.ideavimrc:
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.zshenv:
    ~/.zshrc:

- shell: [bash config/homebrew/install.sh] # install Homebrew packages from Brewfile (set DOTFILES_BREWFILE=labcorp for work machines)
- shell: [bash config/npm/install.sh] # install ccstatusline and other managed npm packages after symlinks are in place
