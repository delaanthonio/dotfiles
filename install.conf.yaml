- defaults:
    link:
      create: true
      relink: true

- shell: [git submodule update --init --recursive]

- shell:
  # Backup-and-link: pre-emptively move aside any existing regular file at a
  # dotbot symlink-target path so the link step can create a fresh symlink
  # without needing force:true (which would clobber user edits silently).
  # Backups are created as <path>.bak.<unix-ts>; once symlinked, subsequent
  # runs are no-ops since dotbot is no longer in conflict with regular files.
  # ~/.codex/config.toml is intentionally NOT in this list — the dotfile
  # is the empty template and the home copy carries rich local config.
  - command: |
      set -euo pipefail
      DOTFILES="${DOTBOT_DIR:-$(pwd)}"
      TS=$(date +%s)

      # home-glob-dir : dotfiles-source-dir pairs; only files whose dotfiles
      # counterpart exists will be backed up. Local-only files stay put.
      for pair in \
          "$HOME/.claude/agents:$DOTFILES/claude/agents" \
          "$HOME/.claude/commands:$DOTFILES/claude/commands" \
          "$HOME/.claude/scripts:$DOTFILES/claude/scripts" \
          "$HOME/.config/fish/completions:$DOTFILES/config/fish/completions" \
          "$HOME/.config/fish/functions:$DOTFILES/config/fish/functions"; do
        home="${pair%%:*}"; src="${pair#*:}"
        [ -d "$home" ] || continue
        for entry in "$home"/*; do
          [ -e "$entry" ] || continue
          [ -L "$entry" ] && continue
          [ -f "$entry" ] || continue
          name=$(basename "$entry")
          [ -e "$src/$name" ] || continue
          mv "$entry" "$entry.bak.$TS"
          echo "preserved $entry -> $entry.bak.$TS"
        done
      done

      # single-file entries
      home="$HOME/.claude/CLAUDE.md"
      src="$DOTFILES/agents/AGENTS.md"
      if [ -f "$home" ] && [ ! -L "$home" ] && [ -f "$src" ]; then
        mv "$home" "$home.bak.$TS"
        echo "preserved $home -> $home.bak.$TS"
      fi

- clean: []

- link:
    ~/.claude/settings.json:
        path: claude/settings.json
        force: true
    ~/.claude/CLAUDE.md/: agents/AGENTS.md
    ~/.claude/agents/:
        path: claude/agents/**
        glob: true
    ~/.claude/commands/:
        path: claude/commands/**
        glob: true
    ~/.claude/scripts/:
        path: claude/scripts/**
        glob: true
    ~/.claude/skills/:
        path: claude/skills
        create: true
        force: true
    ~/.config/direnv/direnvrc: direnvrc
    ~/.config/fish/conf.d:
        path: config/fish/conf.d
        force: true
    ~/.config/fish/completions/:
        path: config/fish/completions/**
        glob: true
    ~/.config/fish/functions/:
        path: config/fish/functions/**
        glob: true
    ~/.config/opencode/AGENTS.md: agents/AGENTS.md
    ~/.config/opencode/agents:
        path: config/opencode/agents
        create: true
        force: true
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.config/ghostty/config:
        path: config/ghostty/config
        force: true
    ~/Library/Application Support/com.mitchellh.ghostty/config:
        if: '[ `uname` = Darwin ]'
        path: config/ghostty/config
        force: true
    ~/Library/Application Support/com.cmuxterm.app/config.ghostty:
        if: '[ `uname` = Darwin ]'
        path: config/cmux/config.ghostty
        force: true
    ~/.config/cmux/cmux.json:
        path: config/cmux/cmux.json
        force: true
    ~/.config/ccstatusline/settings.json:
        path: config/ccstatusline/settings.json
        force: true
    ~/.config/tmux/tmux.conf:
      path: config/tmux/tmux.conf
      force: true
    ~/.config/tmux/options.conf:
      path: config/tmux/options.conf
      force: true
    ~/.config/tmux/bindings.conf:
      path: config/tmux/bindings.conf
      force: true
    ~/.config/tmux/theme.conf:
      path: config/tmux/theme.conf
      force: true
    ~/.config/tmux/status.conf:
      path: config/tmux/status.conf
      force: true
    ~/.config/tmux/host-status.sh:
      path: config/tmux/host-status.sh
      force: true
    ~/.config/tmux/cheatsheet.sh:
      path: config/tmux/cheatsheet.sh
      force: true
    ~/.config/tmux/clipboard.sh:
      path: config/tmux/clipboard.sh
      force: true
    ~/.config/tmux/sessionizer.sh:
      path: config/tmux/sessionizer.sh
      force: true
    ~/.config/tmux/health-check.sh:
      path: config/tmux/health-check.sh
      force: true
    ~/.config/zellij/config.kdl:
        path: config/zellij/config.kdl
        force: true
    ~/.config/zellij/layouts:
        path: config/zellij/layouts
        force: true
    ~/.config/nvim:
    ~/.config/starship.toml: starship.toml
    ~/.config/topgrade.toml:
    ~/.doom.d:
    ~/.emacs.d:
    ~/.ideavimrc:
    ~/.gitconfig:
    ~/.gitignore_global:
    ~/.zshenv:
    ~/.zshrc:

- shell: [bash config/npm/install.sh] # install ccstatusline and other managed npm packages after symlinks are in place
