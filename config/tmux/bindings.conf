# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Pane management
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -n M-n split-window -h -c "#{pane_current_path}"
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind z resize-pane -Z

# Resize
bind -n M-= resize-pane -R 3 \; resize-pane -D 1
bind -n M-- resize-pane -L 3 \; resize-pane -U 1
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3

# Windows
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind -n M-i swap-window -t -1 \; previous-window
bind -n M-o swap-window -t +1 \; next-window
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-w confirm-before -p "kill window #W? (y/n)" kill-window
bind -n M-] next-window
bind -n M-[ previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Session
bind d detach-client
bind s choose-tree -Zs
bind p display-popup -w 90% -h 80% -E "~/.config/tmux/sessionizer.sh"
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Copy mode
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
if-shell "command -v pbcopy || command -v wl-copy || command -v xclip || command -v xsel" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.config/tmux/clipboard.sh"'

# Keybinding hints
bind ? display-popup -w 72 -h 32 -E "~/.config/tmux/cheatsheet.sh"

# Action menu
bind Space display-menu -T "#[align=centre]tmux actions" -x C -y C \
  "Split right"        % "split-window -h -c '#{pane_current_path}'" \
  "Split down"         '"' "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane"          z "resize-pane -Z" \
  "Close pane"         x "confirm-before -p 'kill pane #P? (y/n)' kill-pane" \
  "" \
  "New window"         c "new-window -c '#{pane_current_path}'" \
  "Rename window"      n "command-prompt -I '#W' \"rename-window '%%'\"" \
  "Next window"        . "next-window" \
  "Prev window"        , "previous-window" \
  "" \
  "Session picker"     s "choose-tree -Zs" \
  "Project session"    p "display-popup -w 90% -h 80% -E '~/.config/tmux/sessionizer.sh'" \
  "Detach"             d "detach-client" \
  "Reload config"      r "source-file ~/.config/tmux/tmux.conf" \
  "" \
  "Cheatsheet"         ? "display-popup -w 70 -h 30 -E 'tmux list-keys'"
