# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282828,fg=#ebdbb2"

# Left: session pill
set -g status-left-length 40
set -g status-left "#[bg=#d79921,fg=#282828,bold] #S #[default] "

# Right: prefix indicator, remote host, date, time
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#282828#,bg=#d65d0e#,bold] prefix #[default] ,}#(~/.config/tmux/host-status.sh) #[fg=#282828,bg=#689d6a] %b %d #[default] #[fg=#282828,bg=#458588,bold] %H:%M "

# Window tabs
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#928374,bg=#282828] #I #W "
setw -g window-status-current-format "#[fg=#282828,bg=#458588,bold] #I #W #[default]"
