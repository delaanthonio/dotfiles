# Gruvbox-dark theme
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"

set -g pane-border-status off

set -g message-style "bg=#d79921,fg=#282828,bold"

set -g mode-style "fg=#282828,bg=#458588"
set -g copy-mode-position-style "fg=#fbf1c7,bg=#504945,bold"
set -g copy-mode-position-format "#[align=right] #{scroll_position}/#{history_size}#{?search_count, · #{search_count}#{?search_count_partial,+,} results,}#{?search_timed_out, · timed out,} "
set -g copy-mode-match-style "fg=#282828,bg=#fabd2f"
set -g copy-mode-current-match-style "fg=#282828,bg=#fe8019,bold"
set -g copy-mode-mark-style "fg=#fbf1c7,bg=#cc241d"
