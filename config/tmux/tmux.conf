# tmux configuration — designed to complement zellij (config/zellij/config.kdl)
# Shares the same muscle memory: Alt+hjkl navigation, vi keys, gruvbox theme.
# tmux 3.x (XDG path: ~/.config/tmux/tmux.conf)

# ── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-kitty:Tc"  # truecolor + kitty
set -g focus-events on
set -sg escape-time 0          # no delay for Alt/Esc keys (matches zellij feel)
set -g history-limit 10000     # same scrollback as zellij scroll_buffer_size
set -g mouse on                # zellij mouse_mode default true
set -g base-index 1            # tabs/windows start at 1 (like zellij GoToTab 1)
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi
setw -g status-keys vi
set -g allow-rename off        # keep manual window names

# ── Prefix ──────────────────────────────────────────────────────────────────
# Keep tmux's Ctrl-b prefix (mirrors zellij's tmux-compat mode).
# Most actions below are prefix-less Alt bindings, matching zellij muscle memory.
set -g prefix C-b
bind C-b send-prefix

# Reload config (prefix r)
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Pane navigation: Alt+hjkl / Alt+arrows (no prefix) ───────────────────────
# Mirrors zellij `shared_except "locked"` MoveFocus bindings.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ── Pane management ──────────────────────────────────────────────────────────
# Splits keep cwd. zellij: " = down, % = right.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -n M-n split-window -h -c "#{pane_current_path}"   # Alt+n new pane (zellij)
bind x kill-pane
bind z resize-pane -Z                                   # zoom/fullscreen toggle

# Resize: Alt += / Alt - (zellij shared Resize Increase/Decrease)
bind -n M-= resize-pane -R 3 \; resize-pane -D 1
bind -n M-- resize-pane -L 3 \; resize-pane -U 1
# Fine resize under prefix with vi keys
bind -r H resize-pane -L 3
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 3

# ── Windows (zellij "tabs") ──────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"            # zellij tmux: c = NewTab
bind , command-prompt -I "#W" "rename-window '%%'"     # zellij , = RenameTab
bind -n M-i swap-window -t -1 \; previous-window       # MoveTab Left
bind -n M-o swap-window -t +1 \; next-window           # MoveTab Right
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Session ──────────────────────────────────────────────────────────────────
bind d detach-client                                   # zellij session: d = Detach
bind s choose-tree -Zs                                 # session/window picker

# ── Copy mode (vi) — zellij scroll/search parity ─────────────────────────────
bind [ copy-mode                                       # zellij tmux: [ = Scroll
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# pbcopy on macOS (mirrors zellij copy_command "pbcopy")
if-shell "command -v pbcopy" \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# ── Keybinding hints (no plugins; native popups/menus) ───────────────────────
# Cheatsheet popup — prefix ? (like zellij's status-bar hints).
bind ? display-popup -w 70 -h 30 -E "cat <<'EOF'
                       tmux keybindings
  ───────────────────────────────────────────────────────────
  Panes (no prefix)
    Alt+h/j/k/l ........ focus pane (left/down/up/right)
    Alt+n .............. new pane (split right)
    Alt+= / Alt+- ...... grow / shrink pane
  Panes (prefix C-b)
    \" / % .............. split down / right
    z .................. zoom (fullscreen toggle)
    x .................. close pane
    H/J/K/L ............ fine resize

  Windows / tabs (no prefix)
    Alt+1..9 ........... go to window N
    Alt+i / Alt+o ...... move window left / right
  Windows (prefix C-b)
    c .................. new window     , ... rename window

  Session (prefix C-b)
    d .................. detach         s ... session picker
    r .................. reload config

  Copy mode (prefix C-b)
    [ .................. enter scroll/copy   v=select  y=yank

  Menus
    Space .............. action menu     ? ... this cheatsheet
  ───────────────────────────────────────────────────────────
            (press q or Esc to close)
EOF
read"

# Action menu — prefix Space (zellij NextSwapLayout was Space; here a do-menu).
bind Space display-menu -T "#[align=centre]tmux actions" -x C -y C \
  "Split right"        % "split-window -h -c '#{pane_current_path}'" \
  "Split down"         '"' "split-window -v -c '#{pane_current_path}'" \
  "Zoom pane"          z "resize-pane -Z" \
  "Close pane"         x "kill-pane" \
  "" \
  "New window"         c "new-window -c '#{pane_current_path}'" \
  "Rename window"      n "command-prompt -I '#W' \"rename-window '%%'\"" \
  "Next window"        . "next-window" \
  "Prev window"        , "previous-window" \
  "" \
  "Session picker"     s "choose-tree -Zs" \
  "Detach"             d "detach-client" \
  "Reload config"      r "source-file ~/.config/tmux/tmux.conf" \
  "" \
  "Cheatsheet"         ? "display-popup -w 70 -h 30 -E 'tmux list-keys'"

# ─────────────────────────────────────────────────────────────────────────────
# Theme: gruvbox-dark, compact -- colored blocks (no powerline glyphs)
# Powerline arrows render unreliably on the pane-border line, so plain blocks.
# ─────────────────────────────────────────────────────────────────────────────

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"

# Pane title bar — shows current command; active pane in yellow powerline pill
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#282828]#[bg=#d79921]#[bold] #{pane_current_command} #[default],#[fg=#928374]#[default] #{pane_current_command} }"

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#282828,fg=#ebdbb2"

# Left: session pill
set -g status-left-length 40
set -g status-left "#[bg=#d79921,fg=#282828,bold] #S #[default] "

# Right: prefix indicator, date, time
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#282828#,bg=#d65d0e#,bold] PREFIX #[default] ,}#[fg=#282828,bg=#689d6a] %b %d #[default] #[fg=#282828,bg=#458588,bold] %H:%M #[default]"

# Window tabs: thin divider between inactive, filled arrows around active
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#928374,bg=#282828] #I #W "
setw -g window-status-current-format "#[fg=#282828,bg=#458588,bold] #I #W #[default]"

set -g message-style "bg=#d79921,fg=#282828,bold"
set -g mode-style "bg=#458588,fg=#282828"
