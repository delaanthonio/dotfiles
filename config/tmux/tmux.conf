# tmux configuration — designed to complement zellij (config/zellij/config.kdl)
# Shares the same muscle memory: Alt+hjkl navigation, vi keys, gruvbox theme.
# tmux 3.x (XDG path: ~/.config/tmux/tmux.conf)

source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/bindings.conf
source-file ~/.config/tmux/theme.conf
source-file ~/.config/tmux/status.conf
