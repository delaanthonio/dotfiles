# General options
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-kitty:Tc"

# Extended keys (tmux 3.5+) — required for Alt+hjkl / Alt+= / Alt+digits
# in capable terminals (cmux, ghostty, kitty). Without these, Alt binds
# fall back to ESC+key sequences that clash with copy/vi modes.
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on
set -sg escape-time 10
set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on
setw -g mode-keys vi
setw -g status-keys vi
set -g allow-rename off

# Prefix
set -g prefix C-b
bind C-b send-prefix
